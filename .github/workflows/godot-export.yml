name: Godot export

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: godot-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with MindStakes.csproj (Godot.NET.Sdk) and project.godot (config/features).
  GODOT_VERSION: 4.7.2-stable

jobs:
  export:
    name: Export ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: ubuntu-latest
            editor_platform: linux
            preset: Windows Desktop
            output: build/windows/MindStakes.exe
            archive: mindstakes-windows-x86_64.zip
            templates_dir: /home/runner/.local/share/godot/export_templates
          - name: Linux
            os: ubuntu-latest
            editor_platform: linux
            preset: Linux
            output: build/linux/MindStakes.x86_64
            archive: mindstakes-linux-x86_64.zip
            templates_dir: /home/runner/.local/share/godot/export_templates
          - name: macOS
            os: macos-latest
            editor_platform: macos
            preset: macOS
            output: build/macos/MindStakes.zip
            archive: mindstakes-macos-universal.zip
            templates_dir: /Users/runner/Library/Application Support/Godot/export_templates
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot editor and export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ${{ matrix.templates_dir }}
          key: godot-${{ env.GODOT_VERSION }}-mono-${{ runner.os }}

      - name: Install Godot editor
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/godot/godot" ]; then
            echo "Godot already cached."
            exit 0
          fi

          mkdir -p "$HOME/godot"
          if [ "${{ matrix.editor_platform }}" = "macos" ]; then
            asset="Godot_v${GODOT_VERSION}_mono_macos.universal.zip"
          else
            asset="Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          fi

          gh release download "${GODOT_VERSION}" --repo godotengine/godot \
            --pattern "$asset" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/godot"

          if [ "${{ matrix.editor_platform }}" = "macos" ]; then
            binary="$(find "$RUNNER_TEMP/godot" -type f -path '*/Contents/MacOS/Godot' | head -n1)"
          else
            binary="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v*_mono_linux.x86_64' | head -n1)"
          fi

          if [ -z "$binary" ]; then
            echo "::error::Godot editor binary not found in $asset"
            exit 1
          fi

          relative="${binary#"$RUNNER_TEMP/godot/"}"
          cp -a "$RUNNER_TEMP/godot/." "$HOME/godot/"
          chmod +x "$HOME/godot/$relative"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$HOME/godot/$relative" > "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail
          templates_dir="${{ matrix.templates_dir }}"
          if compgen -G "$templates_dir/*.mono/version.txt" > /dev/null; then
            echo "Export templates already cached."
            exit 0
          fi
          gh release download "${GODOT_VERSION}" --repo godotengine/godot \
            --pattern "Godot_v${GODOT_VERSION}_mono_export_templates.tpz" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/Godot_v${GODOT_VERSION}_mono_export_templates.tpz" -d "$RUNNER_TEMP/templates"
          version="$(cat "$RUNNER_TEMP/templates/templates/version.txt")"
          mkdir -p "$templates_dir"
          rm -rf "$templates_dir/$version"
          mv "$RUNNER_TEMP/templates/templates" "$templates_dir/$version"

      - name: Import project
        shell: bash
        run: |
          "$HOME/godot/godot" --headless --path "$GITHUB_WORKSPACE" --import

      - name: Export ${{ matrix.name }} build
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ matrix.output }}")"
          "$HOME/godot/godot" --headless --path "$GITHUB_WORKSPACE" \
            --export-release "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Package build
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            Windows)
              (cd build/windows && zip -qr "$GITHUB_WORKSPACE/dist/${{ matrix.archive }}" .)
              ;;
            Linux)
              (cd build/linux && zip -qr "$GITHUB_WORKSPACE/dist/${{ matrix.archive }}" .)
              ;;
            macOS)
              cp "build/macos/MindStakes.zip" "dist/${{ matrix.archive }}"
              ;;
            *)
              echo "::error::Unknown export target ${{ matrix.name }}"
              exit 1
              ;;
          esac
          ls -lh "dist/${{ matrix.archive }}"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: mindstakes-${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          retention-days: 14

  release:
    name: Publish release
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: mindstakes-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "MindStakes $GITHUB_REF_NAME" \
            --generate-notes
