name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Assets are stored with Git LFS.
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MindStakes.sln

      - name: Build
        run: dotnet build MindStakes.sln --no-restore --nologo

  repo-guard:
    name: Question data guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fail when real question or category data is committed
        run: |
          unexpected="$(git ls-files 'Resources/Questions' 'Resources/Categories' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Question and category data must stay outside the repository. See README.md -> Question data."
            printf '%s\n' "$unexpected"
            exit 1
          fi

          examples="$(git ls-files 'Resources/Examples' || true)"
          if [ -z "$examples" ]; then
            echo "::error::Example questions and categories are missing from Resources/Examples."
            exit 1
          fi

          echo "Only Resources/Examples is tracked."

  version-guard:
    name: Godot version guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Keep project, SDK and workflow versions in sync
        run: |
          sdk_version="$(sed -n 's|.*Godot.NET.Sdk/\([0-9.]*\).*|\1|p' MindStakes.csproj)"
          feature_version="$(sed -n 's/.*config\/features=PackedStringArray("\([0-9.]*\)".*/\1/p' project.godot)"
          workflow_version="$(sed -n 's/.*GODOT_VERSION: \([0-9.]*\)-stable.*/\1/p' .github/workflows/godot-export.yml | head -n1)"

          echo "SDK: ${sdk_version:-<missing>}"
          echo "project.godot feature: ${feature_version:-<missing>}"
          echo "export workflow: ${workflow_version:-<missing>}"

          if [ -z "$sdk_version" ] || [ -z "$feature_version" ] || [ -z "$workflow_version" ]; then
            echo "::error::Could not read all Godot versions."
            exit 1
          fi
          if [ "$sdk_version" != "$workflow_version" ]; then
            echo "::error::MindStakes.csproj ($sdk_version) and godot-export.yml ($workflow_version) differ."
            exit 1
          fi
          if [ "${sdk_version%.*}" != "$feature_version" ]; then
            echo "::error::project.godot features ($feature_version) do not match the SDK major.minor ($sdk_version)."
            exit 1
          fi
